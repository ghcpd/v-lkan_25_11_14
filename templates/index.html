<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-gradient-to-br from-sky-50 via-white to-indigo-50 min-h-screen">
    <div class="container mx-auto p-6">
      <header class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-extrabold text-slate-800">User Management Dashboard</h1>
          <p class="text-sm text-slate-500">Manage users, roles, and exports</p>
        </div>
        <div class="flex items-center gap-3">
          <button id="exportCsv" class="bg-gradient-to-r from-indigo-600 to-sky-500 text-white px-4 py-2 rounded-md shadow hover:brightness-105 transition">Export CSV</button>
          <button id="exportJson" class="bg-white border border-slate-300 px-4 py-2 rounded-md shadow hover:bg-slate-50 transition">Export JSON</button>
          <button id="showAddModal" class="bg-emerald-500 text-white px-4 py-2 rounded-md shadow hover:brightness-105 transition">+ Add User</button>
        </div>
      </header>

      <!-- Error banner -->
      <div id="errorBanner" class="hidden mt-6 p-4 rounded-md bg-red-100 text-red-800">Error message</div>

      <!-- Main controls -->
      <div class="mt-6 flex flex-col md:flex-row items-start md:items-center gap-4 md:gap-6">
        <div class="flex items-center gap-2 w-full md:w-1/3">
          <input id="searchInput" placeholder="Search name or email..." class="w-full rounded-md border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-300" />
          <button id="searchBtn" class="bg-sky-600 text-white px-3 py-2 rounded-md">Search</button>
        </div>
        <div class="ml-auto flex items-center gap-3">
          <label class="text-sm text-slate-600">Sort</label>
          <select id="sortBy" class="border rounded px-2 py-1">
            <option value="name">Name</option>
            <option value="email">Email</option>
            <option value="role">Role</option>
            <option value="id">ID</option>
          </select>
          <select id="order" class="border rounded px-2 py-1">
            <option value="asc">Asc</option>
            <option value="desc">Desc</option>
          </select>
          <select id="limit" class="border rounded px-2 py-1">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </div>
      </div>

      <!-- Table -->
      <div class="mt-6 bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full text-left">
          <thead class="bg-slate-50">
            <tr>
              <th class="px-6 py-3 text-sm font-medium text-slate-700">Name</th>
              <th class="px-6 py-3 text-sm font-medium text-slate-700">Email</th>
              <th class="px-6 py-3 text-sm font-medium text-slate-700">Role</th>
              <th class="px-6 py-3 text-sm font-medium text-slate-700 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y">
            <tr><td colspan="4" class="p-6 text-center text-slate-400">Loading users...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="mt-4 flex items-center justify-between">
        <div class="text-sm text-slate-600" id="totalCount">Total: 0</div>
        <div class="flex items-center gap-2">
          <button id="prevPage" class="px-3 py-1 rounded border">Prev</button>
          <span id="pageIndicator" class="px-3 py-1 text-sm">1</span>
          <button id="nextPage" class="px-3 py-1 rounded border">Next</button>
        </div>
      </div>
    </div>

    <!-- Add/Edit modal -->
    <div id="userModal" class="fixed inset-0 flex items-center justify-center bg-black/40 hidden">
      <div class="bg-white rounded-lg p-6 w-full max-w-md">
        <h3 id="modalTitle" class="text-xl font-bold mb-4">Add user</h3>
        <div class="space-y-3">
          <div>
            <label class="text-sm text-slate-700">Name</label>
            <input id="userName" class="w-full border rounded px-3 py-2" />
          </div>
          <div>
            <label class="text-sm text-slate-700">Email</label>
            <input id="userEmail" class="w-full border rounded px-3 py-2" />
          </div>
          <div>
            <label class="text-sm text-slate-700">Role</label>
            <select id="userRole" class="w-full border rounded px-3 py-2">
              <option value="admin">admin</option>
              <option value="editor">editor</option>
              <option value="viewer">viewer</option>
            </select>
          </div>
        </div>
        <div class="mt-4 flex justify-end gap-2">
          <button id="cancelModal" class="px-3 py-2 border rounded">Cancel</button>
          <button id="saveUser" class="px-4 py-2 bg-emerald-500 text-white rounded">Save</button>
        </div>
      </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="deleteModal" class="fixed inset-0 flex items-center justify-center bg-black/40 hidden">
      <div class="bg-white rounded-lg p-6 w-full max-w-sm">
        <h3 class="text-lg font-semibold">Confirm delete</h3>
        <p class="mt-2 text-sm text-slate-600">Are you sure you want to delete this user? This action cannot be undone.</p>
        <div class="mt-4 flex justify-end gap-2">
          <button id="cancelDelete" class="px-3 py-2 border rounded">Cancel</button>
          <button id="confirmDelete" class="px-4 py-2 bg-red-600 text-white rounded">Delete</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
      // small accessibility enhancement: focus search input on load
      document.getElementById('searchInput').focus();
    </script>
  </body>
</html>
